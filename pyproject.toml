[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotationledger"
version = "1.0.0"
description = "Track the lifetime of leaked secrets through git history and report exposure days."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["secrets", "git", "entropy", "credentials", "exposure", "rotation"]
authors = [{ name = "VanTaS15" }]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
