<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<!--
  Palette reason: the subject is credential exposure over time. Two core colours
  encode secret state: teal (#2f6f6a) for a secret that was rotated and is no
  longer live, and one accent, burnt amber (#b3541e), used exactly once for the
  single still-live secret, which is the thing to read first. Neutrals (ink
  #1b2733, grey #5b6670, hairline #c3c9cf) do not count toward the budget.
  Every number here comes from: rotationledger report samples/history.gitlog
  (bearer 87d rotated, aws 74d rotated, generic 47d live). Dates span the
  analysed history, 2026-01-05 to 2026-04-02.
-->
<title id="title">rotationledger exposure timeline</title>
<desc id="desc">Horizontal bars showing days each secret stayed live in git history. bearer-token 87 days rotated, aws-access-key 74 days rotated, generic-high-entropy 47 days still live. Dates run from 2026-01-05 to 2026-04-02.</desc>
<rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
<text x="24" y="34" fill="#1b2733" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">Secret exposure windows (days live in history)</text>
<text x="24" y="54" fill="#5b6670" font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="12">source: rotationledger report samples/history.gitlog</text>

